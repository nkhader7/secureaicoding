cache:
  ttl: "session"
  key: "$file_path:$file_mtime"

batches:
  - name: "server_code"
    file_types: [".py", ".js", ".ts", ".java", ".go"]
    rules: ["INJ-001", "INJ-002"]

rules:
  - id: "INJ-001"
    name: "Command Injection via Shell Concatenation"
    severity: "high"
    file_types: [".py", ".js", ".ts", ".go"]
    min_line_length: 8
    max_file_size_kb: 150
    exclude_comments: true
    confidence:
      threshold: 0.7
      signals:
        - pattern: '(exec|spawn|system)\\s*\\('
          weight: 0.4
        - pattern: '(\"|\'').*(\+|\\$\\{).*(\"|\'')'
          weight: 0.4
        - pattern: '(shlex\\.quote|escapeshellarg|ProcessBuilder\\()'
          weight: -0.4
    detection:
      type: "regex"
      regex_pattern: '\\b(exec|spawn|system|popen)\\s*\\([^\\n]*(\+|\\$\\{)'
      context_lines: 1
    remediation: "Use parameterized process APIs and avoid shell string concatenation."
    references: ["CWE-78", "OWASP A03:2021"]

  - id: "INJ-002"
    name: "SQL Injection via Dynamic Query Construction"
    severity: "critical"
    file_types: [".py", ".js", ".ts", ".java", ".go"]
    min_line_length: 8
    max_file_size_kb: 150
    exclude_comments: true
    confidence:
      threshold: 0.75
      signals:
        - pattern: '(SELECT|INSERT|UPDATE|DELETE).*(\+|f\"|\\$\\{)'
          weight: 0.5
        - pattern: '(execute|query)\\s*\\('
          weight: 0.3
        - pattern: '(prepared|parameterized|bindParam|\?)'
          weight: -0.5
    detection:
      type: "regex"
      regex_pattern: '\\b(execute|query)\\s*\\([^\\n]*(SELECT|INSERT|UPDATE|DELETE)[^\\n]*(\+|f\"|\\$\\{)'
      context_lines: 1
    remediation: "Use prepared statements/parameterized queries and bind variables."
    references: ["CWE-89", "OWASP A03:2021"]
