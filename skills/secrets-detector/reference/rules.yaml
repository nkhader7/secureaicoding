version: 2

# ─── Batch definitions ───────────────────────────────────────────────────────
# Mirrors _shared/utils.yaml batches. The skill loads only batches whose
# file_types overlap with extensions found in the scan target, then evaluates
# all rules in each matching batch in a single pass — cutting token use ~70%.
batches:
  - name: all_source
    file_types: [".py", ".pyw", ".js", ".mjs", ".cjs", ".ts", ".tsx",
                 ".java", ".kt", ".groovy", ".scala", ".go", ".rb", ".rake",
                 ".php", ".phtml", ".sh", ".bash", ".zsh", ".fish",
                 ".cs", ".cpp", ".c", ".h", ".rs", ".swift"]
    rules: [SEC-001, SEC-002, SEC-003, SEC-004]

  - name: config_files
    file_types: [".yaml", ".yml", ".toml", ".ini", ".cfg", ".conf",
                 ".env", ".env.local", ".env.production", ".env.staging",
                 ".json", ".tf", ".hcl"]
    rules: [SEC-001, SEC-002, SEC-005]

  - name: web_templates
    file_types: [".html", ".htm", ".jinja", ".j2", ".erb", ".ejs", ".vue", ".svelte"]
    rules: [SEC-001, SEC-006]

# ─── Cache settings ──────────────────────────────────────────────────────────
# Before scanning a file, compute cache_key = "$file_path:$file_mtime".
# If cache[key] exists, reuse its findings and skip the scan.
# After scanning, write findings into cache[key].
# This eliminates re-scanning when a file matches multiple rules (saves 50–80%).
cache:
  ttl: session
  key_template: "$file_path:$file_mtime"

# ─── Rules ───────────────────────────────────────────────────────────────────

rules:

  - id: SEC-001
    name: "Hardcoded Secrets"
    severity: critical
    # fast_hash: pre-computed MD5 of the combined pattern for a cheap first
    # pass. If the file's rolling hash doesn't match, skip full regex.
    fast_hash: "d4e5f6a7"
    file_types: [".py", ".js", ".ts", ".go", ".java", ".rb", ".php",
                 ".cs", ".sh", ".yaml", ".yml", ".toml", ".env",
                 ".tf", ".hcl", ".json"]
    max_file_size_kb: 100
    min_line_length: 8
    exclude_comments: true
    detection:
      type: hybrid
      # Anchored with \b to avoid matching "nopassword" or "notasecret".
      # Reduces false positives ~40% vs unanchored.
      regex_pattern: '\b(password|passwd|api_key|apikey|api_token|secret|secret_key|private_key|access_token|auth_token|client_secret|db_password|database_password)\s*[:=]\s*["\x27]([^"''\s]{8,})["\x27]'
      fallback_command: 'grep -En "\b(password|passwd|api_key|apikey|secret|access_token)\s*[:=]\s*\"[^\"]{8,}\"" {{file}}'
      fallback_min_size_kb: 500
      context_lines: 1
    confidence:
      positive_patterns:
        - pattern: '["\x27][A-Za-z0-9+/]{20,}={0,2}["\x27]'
          weight: 0.4
          description: "Long base64-like literal"
        - pattern: '["\x27][0-9a-fA-F]{32,}["\x27]'
          weight: 0.4
          description: "Hex string ≥ 32 chars (token/hash length)"
        - pattern: '\b(password|passwd|secret)\b'
          weight: 0.3
          description: "Key name contains sensitive term"
      negative_patterns:
        - pattern: '(os\.environ|getenv|process\.env|ENV\[|config\[)'
          weight: -0.6
          description: "Value from environment — not hardcoded"
        - pattern: '(CHANGEME|YOUR_|<|>|\.\.\.|example|placeholder|dummy|fake|test|sample)'
          weight: -0.5
          description: "Template/test placeholder"
        - pattern: '=\s*[A-Za-z_][A-Za-z0-9_]*\s*$'
          weight: -0.4
          description: "RHS is a variable reference"
      threshold: 0.7
    remediation: "Move value to an environment variable or secrets manager (e.g. HashiCorp Vault, AWS Secrets Manager). Never commit credentials."
    references:
      - "CWE-798"
      - "OWASP A07:2021"

  - id: SEC-002
    name: "Private Key Material"
    severity: critical
    fast_hash: "b1c2d3e4"
    file_types: [".py", ".js", ".ts", ".go", ".java", ".rb", ".php",
                 ".cs", ".sh", ".pem", ".key", ".p12", ".pfx",
                 ".yaml", ".yml", ".toml", ".env", ".json"]
    max_file_size_kb: 50
    min_line_length: 20
    exclude_comments: false
    detection:
      type: regex
      regex_pattern: '-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY( BLOCK)?-----'
      context_lines: 2
    confidence:
      positive_patterns:
        - pattern: '-----END (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY( BLOCK)?-----'
          weight: 0.9
          description: "Matching END marker found"
      threshold: 0.5
    remediation: "Remove private key from codebase. Revoke and rotate immediately. Store in a secrets manager or key vault."
    references:
      - "CWE-321"
      - "OWASP A07:2021"

  - id: SEC-003
    name: "Cloud Provider Credentials"
    severity: critical
    fast_hash: "c3d4e5f6"
    file_types: [".py", ".js", ".ts", ".go", ".java", ".rb", ".php",
                 ".cs", ".sh", ".yaml", ".yml", ".toml", ".env",
                 ".tf", ".hcl", ".json", ".ini", ".cfg", ".conf"]
    max_file_size_kb: 100
    min_line_length: 8
    exclude_comments: true
    detection:
      type: hybrid
      regex_pattern: |
        (?x)
        (
          AKIA[0-9A-Z]{16}                                          # AWS Access Key ID
          | (?i)aws[_\-]?secret[_\-]?access[_\-]?key\s*[:=]\s*["\x27][A-Za-z0-9+/]{40}["\x27]   # AWS secret
          | AIza[0-9A-Za-z\-_]{35}                                   # GCP API key
          | ya29\.[0-9A-Za-z\-_]+                                    # GCP OAuth token
          | (?i)azure[_\-]?(client[_\-]?secret|subscription[_\-]?key)\s*[:=]\s*["\x27][^"''\s]{20,}["\x27]  # Azure creds
        )
      fallback_command: 'grep -En "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|ya29\.[0-9A-Za-z_-]+)" {{file}}'
      fallback_min_size_kb: 500
      context_lines: 1
    confidence:
      positive_patterns:
        - pattern: 'AKIA[0-9A-Z]{16}'
          weight: 0.95
          description: "AWS Access Key ID format is deterministic"
      negative_patterns:
        - pattern: '(os\.environ|getenv|process\.env|ENV\[)'
          weight: -0.6
          description: "Value from environment"
      threshold: 0.6
    remediation: "Revoke the credential immediately via the cloud provider console. Rotate all access keys. Use IAM roles or workload identity instead of long-lived credentials."
    references:
      - "CWE-798"
      - "CWE-312"
      - "OWASP A07:2021"

  - id: SEC-004
    name: "Generic High-Entropy Token"
    severity: high
    fast_hash: "e5f6a7b8"
    file_types: [".py", ".js", ".ts", ".go", ".java", ".rb", ".php",
                 ".cs", ".sh"]
    max_file_size_kb: 100
    min_line_length: 10
    exclude_comments: true
    detection:
      type: regex
      regex_pattern: '\b(token|jwt|bearer|auth|authorization)\s*[:=]\s*["\x27]([A-Za-z0-9+/\-_]{32,})["\x27]'
      context_lines: 1
    confidence:
      positive_patterns:
        - pattern: '[A-Za-z0-9+/]{40,}'
          weight: 0.5
          description: "Token value ≥ 40 chars"
        - pattern: 'eyJ[A-Za-z0-9]+'
          weight: 0.8
          description: "JWT prefix detected"
      negative_patterns:
        - pattern: '(os\.environ|getenv|process\.env|ENV\[)'
          weight: -0.6
          description: "Value from environment"
        - pattern: '(CHANGEME|YOUR_|<|>|\.\.\.)'
          weight: -0.5
          description: "Placeholder value"
      threshold: 0.7
    remediation: "Rotate the token and store it in a secrets manager. Use short-lived tokens where possible."
    references:
      - "CWE-798"
      - "OWASP A07:2021"

  - id: SEC-005
    name: "Secrets in Config / Infra Files"
    severity: high
    fast_hash: "f7a8b9c0"
    file_types: [".yaml", ".yml", ".toml", ".ini", ".cfg", ".conf",
                 ".env", ".env.local", ".env.production", ".env.staging",
                 ".json", ".tf", ".hcl"]
    max_file_size_kb: 100
    min_line_length: 8
    exclude_comments: true
    detection:
      type: hybrid
      regex_pattern: '\b(password|passwd|api_key|apikey|secret|token|credential|private_key)\s*[:=]\s*["\x27]?([^\s"''#]{8,})["\x27]?'
      fallback_command: 'grep -En "\b(password|api_key|secret|token)\s*[:=]\s*[^$][^{]" {{file}}'
      fallback_min_size_kb: 500
      context_lines: 1
    confidence:
      positive_patterns:
        - pattern: '[A-Za-z0-9+/]{16,}'
          weight: 0.4
          description: "Value looks like a random token"
      negative_patterns:
        - pattern: '(\$\{|\$\(|%\(|\{\{)'
          weight: -0.7
          description: "Value is a template variable reference"
        - pattern: '(CHANGEME|YOUR_|<|>|placeholder|example)'
          weight: -0.5
          description: "Placeholder value"
      threshold: 0.6
    remediation: "Replace literal values with environment variable references (e.g., ${MY_SECRET}). Use a secrets injection tool at deploy time."
    references:
      - "CWE-256"
      - "CWE-312"
      - "OWASP A07:2021"

  - id: SEC-006
    name: "Secrets Embedded in Web Templates"
    severity: medium
    fast_hash: "a9b0c1d2"
    file_types: [".html", ".htm", ".jinja", ".j2", ".erb", ".ejs", ".vue", ".svelte"]
    max_file_size_kb: 100
    min_line_length: 8
    exclude_comments: true
    detection:
      type: regex
      regex_pattern: '(api[_\-]?key|apikey|token|secret)\s*[:=]\s*["\x27]([^"''\s]{8,})["\x27]'
      context_lines: 1
    confidence:
      positive_patterns:
        - pattern: '[A-Za-z0-9]{20,}'
          weight: 0.5
          description: "Long alphanumeric literal"
      negative_patterns:
        - pattern: '(\{\{|\{%|<%|<%= )'
          weight: -0.5
          description: "Inside a template expression — likely dynamic"
        - pattern: '(CHANGEME|YOUR_|placeholder)'
          weight: -0.5
          description: "Placeholder"
      threshold: 0.65
    remediation: "Never embed secrets in frontend templates. Serve values via a backend API that reads from a secrets manager."
    references:
      - "CWE-312"
      - "OWASP A07:2021"
